services:
  postgres:
    image: postgres:16-alpine
    container_name: daymoon_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-daymoon_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d daymoon_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: daymoon_backend_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/daymoon_db?schema=public
      JWT_SECRET: ${JWT_SECRET:-daymoon-b2b-super-secret-jwt-key-2026}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-daymoon-b2b-super-refresh-secret-jwt-key-2026}
      PORT: 5000
      NODE_ENV: production
    ports:
      - "5000:5000"

volumes:
  postgres_data:
    driver: local
